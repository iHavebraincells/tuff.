<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Vynx Documentation</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#0e0e0f;--panel2:#141416;--line:#242427;--line2:#303035;--text:#ededee;--muted:#96969e;--subtle:#686870;--accent:#d8d8dc;--code:#0c0c0e;--sidebar:280px;--toc:220px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.7 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
button,input{font:inherit}
a{color:inherit;text-decoration:none}
button{color:inherit}
.topbar{height:60px;position:fixed;z-index:50;inset:0 0 auto;background:rgba(9,9,9,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:18px}
.brand{display:flex;align-items:center;gap:10px;width:calc(var(--sidebar) - 22px);flex-shrink:0;font-weight:700;letter-spacing:.04em}
.brand img{width:27px;height:27px;object-fit:contain;border-radius:8px}
.brand-name{font-size:14px}.brand-sub{color:var(--subtle);font-size:10px;font-weight:600;letter-spacing:.13em;margin-left:7px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.top-link{border:1px solid var(--line);padding:5px 9px;border-radius:6px}
.menu-btn{display:none;border:1px solid var(--line);background:#111;border-radius:7px;padding:6px 9px}
.sidebar{position:fixed;z-index:40;top:60px;bottom:0;left:0;width:var(--sidebar);overflow:auto;background:#0b0b0c;border-right:1px solid var(--line);padding:20px 14px 32px}
.search-wrap{position:relative;margin:0 2px 21px}
.search-wrap input{width:100%;height:37px;border:1px solid var(--line);border-radius:7px;background:#111113;color:var(--text);padding:0 35px 0 11px;outline:none;font-size:12px}
.search-wrap input:focus{border-color:#55555b}
.search-icon{position:absolute;right:11px;top:8px;color:var(--subtle);font-size:14px}
.nav-label{margin:20px 8px 7px;color:#66666d;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.nav-link{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:6px;color:#a5a5ad;font-size:12px;cursor:pointer;transition:background .15s,color .15s}
.nav-link:hover{background:#171719;color:#fff}
.nav-link.active{background:#1a1a1d;color:#fff}
.nav-count{font-size:10px;color:#66666d;font-variant-numeric:tabular-nums}
.nav-group{margin:2px 0}
.nav-group summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:8px 9px;color:#b7b7bd;font-size:12px;border-radius:6px}
.nav-group summary::-webkit-details-marker{display:none}
.nav-group summary:hover{background:#151517}
.nav-items{padding-left:8px}
.nav-items .nav-link{font-size:11.5px;padding:5px 9px}
.main-wrap{margin-left:var(--sidebar);padding-top:60px}
.layout{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,820px) var(--toc);gap:68px;padding:58px 54px 100px}
article{min-width:0}
.breadcrumb{font-size:11px;color:var(--subtle);margin-bottom:20px}
.breadcrumb span{padding:0 7px;color:#555}
h1{font-size:38px;line-height:1.17;letter-spacing:-.045em;margin:0 0 15px;font-weight:680}
h2{font-size:22px;letter-spacing:-.03em;margin:42px 0 12px;font-weight:650}
h3{font-size:15px;margin:24px 0 8px;font-weight:650}
.lead{font-size:15px;color:#b3b3ba;max-width:700px;margin:0 0 25px;line-height:1.75}
p{color:#b2b2b9;margin:10px 0 15px}
.meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 28px}
.pill{border:1px solid var(--line2);border-radius:5px;padding:3px 8px;color:#aaaab1;font-size:10px;letter-spacing:.02em}
.pill.live{color:#d6d6db;border-color:#444449}
hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.callout{border:1px solid var(--line);border-left:2px solid #77777f;border-radius:7px;padding:13px 15px;background:#101012;margin:22px 0;color:#bcbcc3;font-size:12px}
.callout strong{color:#eee}
.api-block{border:1px solid var(--line);border-radius:8px;background:#0e0e10;margin:17px 0 22px;overflow:hidden}
.api-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line);gap:10px}
.api-head code{color:#eee;font-size:12px}
.api-body{padding:13px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid #1d1d20;font-size:12px}
.kv:last-child{border-bottom:0}.kv label{color:#777780}.kv div{color:#c0c0c6;overflow-wrap:anywhere}
.codebox{margin:15px 0 20px;border:1px solid #29292e;border-radius:8px;overflow:hidden;background:var(--code)}
.code-top{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;background:#121214;border-bottom:1px solid #242428;color:#777780;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.copy{background:transparent;border:1px solid #303035;border-radius:5px;padding:3px 8px;color:#b8b8be;font-size:10px;cursor:pointer}
.copy:hover{background:#202024;color:#fff}
pre{margin:0;padding:14px 16px;overflow:auto;color:#d7d7dd;font:12px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4}
.kw{color:#c7a7ff}.str{color:#b9d9a9}.fn{color:#e6e6eb}.cm{color:#74747d}.num{color:#e4c28b}
.toc{position:sticky;top:91px;align-self:start;max-height:calc(100vh - 115px);overflow:auto;border-left:1px solid var(--line);padding-left:17px}
.toc-title{font-size:10px;color:#777780;text-transform:uppercase;letter-spacing:.13em;font-weight:700;margin:0 0 10px}
.toc a{display:block;font-size:11px;color:#85858d;padding:5px 0}.toc a:hover{color:#fff}
.api-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:20px 0}
.api-card{border:1px solid var(--line);border-radius:7px;padding:12px;background:#101012;cursor:pointer;transition:border-color .15s,background .15s}
.api-card:hover{border-color:#55555b;background:#141416}
.api-card code{font-size:12px;color:#e5e5e9}.api-card small{display:block;color:#777780;font-size:10px;margin-top:4px}
.empty{padding:18px;color:#85858d;font-size:12px}
.footer{border-top:1px solid var(--line);padding-top:20px;margin-top:60px;display:flex;justify-content:space-between;color:#65656d;font-size:10px}
.mobile-scrim{display:none}
@media(max-width:1150px){.layout{grid-template-columns:minmax(0,1fr);max-width:900px;padding:42px 34px 80px}.toc{display:none}}
@media(max-width:760px){
 :root{--sidebar:290px}
 .topbar{padding:0 14px}.brand{width:auto;flex:1}.brand-sub{display:none}.top-actions{display:none}.menu-btn{display:block}
 .sidebar{transform:translateX(-102%);transition:transform .22s ease;box-shadow:20px 0 60px #0008}.sidebar.open{transform:translateX(0)}
 .mobile-scrim.show{display:block;position:fixed;z-index:35;inset:60px 0 0;background:#0009}
 .layout{padding:32px 19px 65px}
 h1{font-size:31px}h2{font-size:20px}.lead{font-size:14px}
 .api-list{grid-template-columns:1fr}
 .kv{grid-template-columns:105px minmax(0,1fr)}
 .footer{gap:8px;flex-direction:column}
}

/* Mobile layout correction: the desktop sidebar offset must not reserve space
   when the sidebar becomes an off-canvas drawer. */
@media (max-width: 760px) {
  html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
  .main-wrap {
    margin-left: 0 !important;
    width: 100%;
    min-width: 0;
  }
  .layout {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    margin: 0;
    padding: 30px 20px 64px;
  }
  article, #content {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }
  .lead { max-width: 100%; }
  h1, h2, h3, p { overflow-wrap: anywhere; }
  .meta-row { gap: 7px; }
  .pill { max-width: 100%; }
  .api-block, .codebox, .api-card { max-width: 100%; min-width: 0; }
  pre {
    max-width: 100%;
    white-space: pre;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-size: 11px;
  }
  .kv { grid-template-columns: minmax(86px, 30%) minmax(0, 1fr); }
  .kv div { min-width: 0; overflow-wrap: anywhere; }
  .footer { min-width: 0; }
  .sidebar {
    width: min(290px, 86vw);
    max-width: 86vw;
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .topbar {
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
}

</style>
</head>

  document.querySelectorAll(".nav-link").forEach(a=>a.classList.toggle("active",a.dataset.page===page || (api && a.dataset.api===api.ns+"|"+api.name)));
}
function codeBox(code){
 return `<div class="codebox"><div class="code-top"><span>Luau</span><button class="copy" data-copy="${encodeURIComponent(code)}">Copy</button></div><pre>${esc(code)}</pre></div>`;
}
function setToc(){
 const links=[...$("#content").querySelectorAll("h2,h3")];
 $("#tocLinks").innerHTML=links.map((h,i)=>{h.id=h.id||"section-"+i;return `<a href="#${h.id}">${esc(h.textContent)}</a>`}).join("");
}

function renderCategory(ns){
 const group=GROUPS.find(g=>g.id===ns);if(!group){renderHome();return}
 setActive("",null);
 $("#content").innerHTML=`<div class="breadcrumb">API Reference <span>/</span> ${esc(group.title)}</div><h1>${esc(group.title)}</h1><p class="lead">${esc(NSINFO[ns]?.[1]||"Registered native API namespace.")}</p><div class="meta-row"><span class="pill">${group.items.length} exports</span><span class="pill">Source indexed</span></div><h2>Functions</h2><div class="api-list">${group.items.map(n=>`<div class="api-card" onclick="location.hash='#/api/${encodeURIComponent(ns)}/${encodeURIComponent(n)}'"><code>${esc(n)}</code><small>${esc((APIs.find(x=>x.ns===ns&&x.name===n)||{}).kind||"export")}</small></div>`).join("")}</div>`;
 setToc();
}
function renderApi(ns,name){
 const a=APIs.find(x=>x.ns===ns&&x.name===name);
 if(!a){renderHome();return}
 setActive("",a);
 const nsTitle=NSINFO[ns]?.[0]||ns;
 const sig=a.args.length?`(${a.args.map((t,i)=>`arg${i+1}: ${t}`).join(", ")})`:"(arguments not inferred)";
 const argRows=a.args.length?a.args.map((t,i)=>`<div class="kv"><label>Argument ${i+1}</label><div>${esc(t)} <span style="color:#777">· detected from native Lua checks</span></div></div>`).join(""):`<div class="kv"><label>Arguments</label><div>No simple argument checks were detected. Consult the implementation before calling.</div></div>`;
 const codeName=a.kind==="table"?`${ns}.${name}`:name;
 const safeExample=!a.sensitive;
 let example="";
 if(safeExample){
   if(a.args.length){
     const vals=a.args.map((t,i)=>t.includes("string")?`"replace with a valid string"`:t.includes("integer")||t.includes("number")?"1":t.includes("boolean")?"true":"value").join(", ");
     example=`-- Replace placeholders with valid values for your environment.\nlocal result = ${codeName}(${vals})\nprint(result)`;
   }else{
     example=`-- Check the native implementation for required arguments.\nlocal result = ${codeName}()\nprint(result)`;
   }
 }
 $("#content").innerHTML=`<div class="breadcrumb">API Reference <span>/</span> ${esc(nsTitle)} <span>/</span> ${esc(name)}</div>
 <h1>${esc(name)}</h1><p class="lead">${esc(a.desc)} ${esc(a.overview)}</p>
 <div class="meta-row"><span class="pill live">Registered</span><span class="pill">${esc(a.kind)}</span><span class="pill">${esc(nsTitle)}</span></div>
 <h2>Overview</h2><p>${esc(a.desc)} The native implementation registered for this name is <code>${esc(a.impl)}</code>.</p>
 <div class="api-block"><div class="api-head"><code>${esc(codeName)}${esc(sig)}</code><span class="pill">${esc(a.kind)}</span></div><div class="api-body">
 <div class="kv"><label>Export name</label><div><code>${esc(name)}</code></div></div>
 <div class="kv"><label>Namespace</label><div>${esc(nsTitle)}</div></div>
 <div class="kv"><label>Native symbol</label><div><code>${esc(a.impl)}</code></div></div>
 <div class="kv"><label>Registration</label><div>${esc(a.kind==="alias"?"Compatibility alias":a.kind==="table"?"Namespace table function":"Global function")}</div></div>
 ${argRows}
 <div class="kv"><label>Return evidence</label><div>${esc(a.ret)}</div></div>
 <div class="kv"><label>Source file</label><div><code>${esc(a.path)}</code></div></div>
 </div></div>
 <h2>Usage</h2>
 ${safeExample?`<p>This is a starting template, not a substitute for the implementation-specific requirements. Replace placeholders with values of the types shown above.</p>${codeBox(example)}`:`<div class="callout"><strong>Reference only.</strong> This API can affect runtime internals, input, game signals, or network behavior. The page records its source registration and implementation identifier, but does not provide an operational example.</div>`}
 <h2>Implementation notes</h2><p>${a.kind==="alias"?"This exported name points to the same native implementation as its related aliases.": "The implementation details are defined in the source file listed above."}</p>
 <div class="callout"><strong>Signature confidence.</strong> The argument list above reflects simple Lua argument checks found in the native implementation. Custom stack parsing and runtime-specific validation may not appear in this summary. A missing argument hint does not mean the function takes no arguments.</div>
 <div class="footer"><span>VYNX · ${esc(nsTitle.toUpperCase())}</span><span>Source: ${esc(a.path)}</span></div>`;
 setToc();
}
function route(){
 const parts=decodeURIComponent(location.hash.replace(/^#\/?/,"")).split("/");
 if(!parts[0])return renderHome();
 if(parts[0]==="environment")return renderEnvironment();
 if(parts[0]==="execution")return renderExecution();
 if(parts[0]==="coverage")return renderCoverage();
 if(parts[0]==="category")return renderCategory(parts[1]);
 if(parts[0]==="api")return renderApi(parts[1],parts.slice(2).join("/"));
 renderHome();
}
function filterNav(){
 const q=$("#search").value.trim().toLowerCase();
 document.querySelectorAll("#navGroups .nav-group").forEach(group=>{
   let matches=0;
   group.querySelectorAll(".nav-link").forEach(link=>{
     const hit=!q||link.textContent.toLowerCase().includes(q)||group.querySelector("summary").textContent.toLowerCase().includes(q);
     link.style.display=hit?"flex":"none";if(hit)matches++;
   });
   group.style.display=matches?"block":"none";
   if(q&&matches)group.open=true;
 });
}
$("#search").addEventListener("input",filterNav);
$("#menuBtn").addEventListener("click",()=>{$("#sidebar").classList.toggle("open");$("#scrim").classList.toggle("show")});
$("#scrim").addEventListener("click",()=>{$("#sidebar").classList.remove("open");$("#scrim").classList.remove("show")});
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-copy]");if(!b)return;
 const value=decodeURIComponent(b.dataset.copy);
 try{await navigator.clipboard.writeText(value);b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)}catch{b.textContent="Select code"}
});
window.addEventListener("hashchange",()=>{route();$("#sidebar").classList.remove("open");$("#scrim").classList.remove("show")});
buildNav();route();
</script>
